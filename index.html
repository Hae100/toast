  <script>
    const form = document.getElementById("toast-form");
    const formView = document.getElementById("form-view");
    const resultView = document.getElementById("result-view");

    const resultTitle = document.getElementById("result-title");
    const adviceContent = document.getElementById("advice-content");
    const toastCard = document.getElementById("toast-card");
    const crisisBanner = document.getElementById("crisis-banner");
    const crisisBannerText = document.getElementById("crisis-banner-text");

    let currentRecordCount = 0;
    let isReady = false;

    const handler = {
      onDataChanged(data) {
        currentRecordCount = data.length;
      }
    };

    function showMessage(message) {
      formMessage.textContent = message;
      formMessage.className = "mt-5 rounded-2xl bg-[#fff0ed] px-4 py-3 text-sm font-bold text-[#b45249]";
    }

    function hideMessage() {
      formMessage.textContent = "";
      formMessage.className = "mt-5 hidden rounded-2xl px-4 py-3 text-sm font-bold";
    }

    function setButtonLoading(loading) {
      bakeButton.disabled = loading;
    }

    // ============================================================
    // 위기 신호(자해/자살 암시, 신체 폭력) 감지
    // 다른 모든 분류보다 최우선으로 검사한다.
    // ============================================================
    const CRISIS_PATTERN =
      /자살|죽고\s*싶|죽고싶|죽어버리|자해|사라지고\s*싶|사라지고싶|살고\s*싶지\s*않|손목\s*긋|칼로\s*긋|목숨|폭행|때렸|맞았|맞은|맞고|밀쳤|밀었|폭력|주먹|발로\s*찼|피가\s*나|다쳤|멍이\s*들|숨\s*막혀|숨을\s*못/;

    function detectCrisis(text) {
      return CRISIS_PATTERN.test(text);
    }

    function makeCrisisAdvice(name) {
      return `${name} 학생, 지금 적어준 내용을 읽고 선생님이 많이 걱정되는 마음으로 이 글을 써요.\n\n` +
        `지금 느끼는 감정이나 겪고 있는 상황은 절대 혼자서 해결하거나 참아야 하는 일이 아니에요. ${name} 학생의 안전과 마음이 무엇보다 소중합니다.\n\n` +
        `[지금 바로 해주었으면 하는 것]\n` +
        `1. 이 화면을 그대로 담임 선생님이나 상담 선생님, 또는 보호자에게 보여주세요.\n` +
        `2. 지금 혼자 있다면, 믿을 수 있는 어른에게 바로 다가가 "저 지금 이야기하고 싶어요"라고 말해 주세요.\n` +
        `3. 몸을 다쳤거나 위험한 상황이라면, 대화보다 안전을 먼저 확보하는 것이 우선이에요.\n\n` +
        `${name} 학생이 지금 이 순간 힘든 마음을 글로 표현해 준 것 자체가 정말 중요한 첫걸음이에요. 이 내용은 선생님께도 함께 전달되니, 선생님이 곧 ${name} 학생과 이야기를 나눌 거예요. 절대 혼자 두지 않을게요.`;
    }

    // 전문 상담사의 관점에서 구체적이고 깊이 있는 조언을 생성하는 함수
    function makeAdvice(name, context, emotion, outcome) {
      const normalized = `${context} ${emotion} ${outcome}`.toLowerCase();
      
      // 1. 공감 및 마음 알아주기
      const opening = `안녕하세요, ${name} 학생. 상담실을 찾아 마음을 나누어 주어 고마워요. 
지금 느끼고 있는 '${emotion}'라는 마음은 결코 잘못되거나 이상한 것이 아니에요. 감정은 우리 마음이 보내는 중요한 신호랍니다. 힘든 상황 속에서도 자신의 마음을 한 걸음 떨어져 바라보고, 어떤 도움이나 변화가 필요한지 스스로 고민해낸 것 자체가 매우 큰 용기이자 성장의 시작이에요.`;

      let interpretation = "";
      let conversation = "";
      let practice = "";

      // 2. 맥락별 전문 분석 및 해결 전략
      if (/친구|짝|단짝|놀이|무시|따돌|혼자|소외|소문/.test(normalized)) {
        interpretation = `학창 시절 친구 관계에서 겪는 갈등은 단순히 옳고 그름의 문제를 넘어 '내가 소중하게 다뤄지고 있는가'에 대한 불안과 직결되곤 해요. 
${name} 학생이 원하고 있는 '${outcome}'라는 결과는 결국 상대방과의 관계에서 더 이상 오해받지 않고 안전함과 신뢰를 회복하고 싶다는 건강한 욕구를 의미합니다. 상대의 오해나 행동에 일일이 휘둘리기보다는, 나의 분명한 의사와 바라는 관계의 형태를 정돈된 언어로 전달할 필요가 있습니다.`;

        conversation = `상대방에게 대화를 청할 때는 상대의 행동을 비난하기보다 '나-전달법(I-Message)'을 활용해 보세요.
• "우리가 함께 지내면서 이런 상황이 생겼을 때, 나는 네 행동에 ${emotion} 마음이 들었어."
• "내가 진정으로 바라는 건 ${outcome}하는 것이야."
• "너는 그때 어떤 마음이었는지, 우리 함께 이야기해볼 수 있을까?"
이처럼 '사실 - 내 감정 - 내가 바라는 점 - 상대에 대한 질문' 순서로 말하면, 상대방도 방어태세를 낮추고 대화에 응할 가능성이 높아집니다.`;

        practice = "1. 대화를 나누기 전, 내가 전하고 싶은 핵심 한 문장을 노트에 미리 적어보세요.\n2. 마음이 여전히 많이 떨리거나 혼자 감당하기 어려운 무시/따돌림 상황이라면, 즉시 담임 선생님이나 상담 선생님, 혹은 보호자에게 이 사실을 알려 전문적인 보호와 중재를 요청하세요. 혼자 견디지 않아도 됩니다.";

      } else if (/화|짜증|분노|열받|속상|답답|억울/.test(normalized)) {
        interpretation = `분노나 억울함은 내 신체적·감정적 경계가 침범당했을 때 스스로를 지키기 위해 나타나는 자연스러운 수호 감정입니다. 
하지만 감정 그 자체와 그 감정을 처리하는 '행동'은 분리되어야 해요. 지금 ${name} 학생이 바라는 '${outcome}'에 다가가기 위해서는, 순간적인 분노 폭발로 인해 진짜 원하는 목적을 놓치지 않도록 신체 감각을 정돈하는 것이 우선입니다.`;

        conversation = `감정이 고조되었을 때는 잠시 감정의 온도를 낮춘 뒤 다음과 같이 상호작용해 보세요.
• "지금 내가 많이 속상하고 ${emotion} 상태라 바로 이야기하면 서로 상처가 될 것 같아."
• "잠시 마음을 가라앉힌 뒤에 이야기하고 싶어."
• (이후 대화 시) "나는 상황이 ${outcome}(으)로 해결되기를 바라. 서로 오해한 부분이 있다면 차분히 풀어보고 싶어."`;

        practice = "1. 마음속으로 1부터 10까지 세며 깊게 숨을 세 번 내쉬는 '5초 멈춤'을 연습해 보세요.\n2. 화가 나는 순간 종이에 내 감정과 원하는 것을 솔직하게 적어본 뒤 구겨서 버리는 방법으로 일차적인 감정 에너지를 발산해보세요.";

      } else if (/슬프|눈물|울|외롭|속상|걱정|불안|무서|두려|우울/.test(normalized)) {
        interpretation = `슬픔과 불안은 우리 마음이 지금 지쳐 있으며 따뜻한 돌봄과 안전이 필요하다고 알려주는 신호입니다. 
이 감정을 억지로 누르거나 참으려고 하면 마음의 짐이 더 묵직해질 수 있어요. ${name} 학생이 바라는 '${outcome}'을 이루기 위해서는, 혼자 이 무게를 짊어지려 하지 말고 외부의 안전한 조력자에게 손을 내미는 과정이 꼭 필요합니다.`;

        conversation = `믿을 수 있는 어른(보호자, 선생님)이나 친구에게 마음을 털어놓을 때 이렇게 표현해 보세요.
• "요즘 나에게 이런 상황이 있어서 마음이 많이 ${emotion}하고 힘들어."
• "혼자 해결하려니 어려워서 도움이 필요해. 내가 ${outcome}할 수 있도록 내 이야기를 들어주거나 함께 방법을 찾아줄 수 있을까?"`;

        practice = "1. 오늘 하루 동안 나를 지지해 줄 수 있는 따뜻한 어른 한 명을 떠올려 보세요.\n2. 직접 말하기가 쑥스럽거나 힘들다면, 방금 이 작성 화면을 그대로 보여주며 이야기의 물꼬를 터보세요. 감정의 무게를 나누는 것만으로도 불안은 크게 줄어듭니다.";

      } else if (/사과|미안|잘못|실수|후회/.test(normalized)) {
        interpretation = `자신의 실수를 인지하고 책임을 느끼는 것은 매우 높이 평가받아야 할 인격적 성숙함입니다. 
진정한 사과는 변명이나 자기정당화 없이 상대방의 피해와 상처 입은 마음을 먼저 헤아려주는 것에서 출발해요. ${name} 학생이 바라는 '${outcome}'에 도달하려면, 진심 어린 사과와 함께 향후 변하겠다는 명확한 행동적 약속이 뒤따라야 합니다.`;

        conversation = `상대방에게 사과할 때는 다음 3단계 구조를 사용해 보세요.
• 1단계 (인정과 공감): "내가 한 행동으로 인해 네가 많이 힘들었을 것 같아 정말 미안해."
• 2단계 (바람과 고백): "나는 우리가 ${outcome}하기를 진심으로 바라고 있어."
• 3단계 (행동 약속): "앞으로는 똑같은 실수를 하지 않도록 이렇게 노력할게. 혹시 내가 어떻게 해주길 원하는지 말해주면 귀 기울일게."`;

        practice = "1. 말로 전하기 어색하다면 정성스럽게 적은 손편지를 전달해 보세요.\n2. 사과한 이후 상대방이 마음을 열기까지 시간이 필요할 수 있다는 점을 인정하고, 서두르지 말고 기다려주는 태도를 보여주세요.";

      } else {
        interpretation = `지금 겪고 있는 상황 속에서 ${name} 학생은 자신의 상황을 다각도로 이해하고 해결책을 찾아가려는 유연한 사고를 보여주고 있습니다. 
우리가 원하는 '${outcome}'에 도달하기 위해서는 현재 상황에서 제어할 수 있는 부분(나의 태도, 나의 대화 방식)과 제어할 수 없는 부분(타인의 반응, 이미 지나간 일)을 구분하는 지혜가 필요합니다.`;

        conversation = `차분한 톤으로 대화의 장을 열어보세요.
• "이번 일에 대해 서로의 생각을 조금 더 깊이 나누어 보고 싶어."
• "나는 이 상황에서 ${emotion} 느낌을 받았고, 결국 ${outcome} 방향으로 잘 해결되었으면 좋겠어."
• "너는 어떻게 생각하는지 네 이야기도 들어보고 싶어."`;

        practice = "1. 내가 당장 할 수 있는 가장 작은 행동 하나를 정해 오늘 바로 실행해 보세요.\n2. 문제를 혼자서만 껴안고 힘들어하기보다는 주위의 경험 많은 어른이나 상담 전문가에게 언제든 조언을 구해보세요.";

      }

      // 3. 용기와 지지의 맺음말
      const closing = `\n\n[상담사의 응원 메시지]\n${name} 학생, 마음의 문제를 해결해 나가는 과정은 밤하늘의 별을 찾는 것처럼 시간이 조금 걸릴 수도 있어요. 하지만 스스로의 감정을 인지하고 적극적으로 해결책을 찾고자 하는 지금의 태도만으로도 이미 올바른 길을 걷고 있습니다. 언제나 ${name} 학생의 건강한 마음과 성장을 응원할게요.`;

      return `${opening}\n\n[전문가 상황 분석]\n${interpretation}\n\n[상담사의 대화법 제안]\n${conversation}\n\n[오늘의 마음 실천 지침]\n${practice}${closing}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideMessage();

      const studentName = document.getElementById("student-name").value.trim();
      const conflictContext = document.getElementById("conflict-context").value.trim();
      const emotion = document.getElementById("emotion").value.trim();
      const desiredOutcome = document.getElementById("desired-outcome").value.trim();

      if (!studentName || !conflictContext || !emotion || !desiredOutcome) {
        showMessage("모든 항목을 입력해야 맛있는 조언 토스트가 완성돼요! 🍞");
        return;
      }

      if (!isReady) {
        showMessage("잠시만요. 마음 토스트의 기록 공간을 준비하고 있어요.");
        return;
      }

      if (currentRecordCount >= 999) {
        showMessage("기록 공간이 가득 찼어요. 선생님께 알려 새 공간을 준비해 주세요.");
        return;
      }

      // 위기 신호를 다른 어떤 분류보다 먼저 검사한다.
      const combinedText = `${conflictContext} ${emotion} ${desiredOutcome}`;
      const riskFlag = detectCrisis(combinedText);
      const advice = riskFlag
        ? makeCrisisAdvice(studentName)
        : makeAdvice(studentName, conflictContext, emotion, desiredOutcome);

      setButtonLoading(true);

      const result = await window.dataSdk.create({
        created_at: new Date().toISOString(),
        student_name: studentName,
        conflict_context: conflictContext,
        emotion: emotion,
        desired_outcome: desiredOutcome,
        advice_card_content: advice,
        risk_flag: riskFlag
      });

      setButtonLoading(false);

      if (!result.isOk) {
        showMessage("조언 토스트를 저장하지 못했어요. 잠시 후 다시 눌러 주세요.");
        return;
      }

      if (riskFlag) {
        resultTitle.textContent = `${studentName} 학생, 선생님이 함께 할게요`;
        toastCard.classList.add("is-crisis");
        crisisBannerText.textContent = "이 내용은 선생님께 즉시 확인이 필요한 내용으로 기록되었어요. 지금 바로 선생님이나 보호자에게 이 화면을 보여주세요.";
        crisisBanner.classList.remove("hidden");
      } else {
        resultTitle.textContent = `${studentName}의 마음 토스트가 완성됐어요`;
        toastCard.classList.remove("is-crisis");
        crisisBanner.classList.add("hidden");
      }

      adviceContent.textContent = advice;

      formView.classList.add("hidden");
      resultView.classList.remove("hidden");
      resultView.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    document.getElementById("reset-button").addEventListener("click", () => {
      form.reset();
      hideMessage();
      resultView.classList.add("hidden");
      crisisBanner.classList.add("hidden");
      toastCard.classList.remove("is-crisis");
      formView.classList.remove("hidden");
      document.getElementById("student-name").focus();
      formView.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    async function initApp() {
      const initResult = await window.dataSdk.init(handler);

      if (initResult.isOk) {
        isReady = true;
      } else {
        showMessage("기록 공간을 준비하지 못했어요. 잠시 후 다시 시도해 주세요.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initApp();
    });
  </script>
 </body>
</html>
